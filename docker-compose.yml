services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestion_stock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stock_db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestion_stock"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stock_db_data:
